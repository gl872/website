content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: type
        label: Type
        type: select
        required: true
        options:
          values:
            - Company news
            - Articles
            - Practical guides
      - name: excerpt
        label: Excerpt
        description: Shown on the blog card. Keep it around 160 characters.
        type: text
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover image alt text
        type: string
      - name: draft
        label: Draft
        description: Turn off and save to publish this post.
        type: boolean
        default: true
      - name: body
        label: Body
        type: rich-text

  - name: author
    label: Blog author
    type: file
    path: src/data/author.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Title
        description: Shown under the name on each post, e.g. "Founder, Krue".
        type: string
        required: true
      - name: photo
        label: Photo
        type: image
        required: true

media:
  input: public/uploads
  output: /uploads
